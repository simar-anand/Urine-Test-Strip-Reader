<!DOCTYPE html>
<head>
    <title>Patient Registration</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <form id="registrationForm" novalidate>
        <fieldset>
            <legend>Patient Information</legend>

            <!-- Patient Name -->
            <div class="form-group">
                <label for="fullName">Patient Name *</label>
                <input type="text" id="fullName" name="fullName">
                <span class="error-message" id="fullNameError"></span>
            </div>

            <!-- Date of Birth -->
            <div class="form-group">
                <label for="dob">Date of Birth *</label>
                <input type="date" id="dob" name="dob">
                <span class="error-message" id="dobError"></span>
            </div>

            <!-- Gender -->
            <div class="form-group">
                <label>Gender *</label>
                <div class="radio-group">
                    <label><input type="radio" id="genderMale" name="gender" value="Male"> Male</label>
                    <label><input type="radio" id="genderFemale" name="gender" value="Female"> Female</label>
                    <label><input type="radio" id="genderOther" name="gender" value="Other"> Other</label>
                </div>
                <span class="error-message" id="genderError"></span>
            </div>

            <!-- Blood Group -->
            <div class="form-group">
                <label for="bloodGroup">Blood Group *</label>
                <select id="bloodGroup" name="bloodGroup">
                    <option value="">-- Select Blood Group --</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
                <span class="error-message" id="bloodGroupError"></span>
            </div>
        </fieldset>

        <fieldset>
            <legend>Contact & Appointment Details</legend>

            <!-- Mobile Number -->
            <div class="form-group">
                <label for="mobile">Mobile Number *</label>
                <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number">
                <span class="error-message" id="mobileError"></span>
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" name="email">
                <span class="error-message" id="emailError"></span>
            </div>

            <!-- Address -->
            <div class="form-group">
                <label for="address">Address *</label>
                <textarea id="address" name="address" rows="3"></textarea>
                <span class="error-message" id="addressError"></span>
            </div>

            <!-- Department / Appointment Type -->
            <div class="form-group">
                <label for="department">Department / Appointment Type *</label>
                <select id="department" name="department">
                    <option value="">-- Select Department --</option>
                    <option value="General Medicine">General Medicine</option>
                    <option value="Pediatrics">Pediatrics</option>
                    <option value="Orthopedics">Orthopedics</option>
                    <option value="Cardiology">Cardiology</option>
                    <option value="Dermatology">Dermatology</option>
                </select>
                <span class="error-message" id="departmentError"></span>
            </div>

            <!-- Registration Date -->
            <div class="form-group">
                <label for="regDate">Registration Date *</label>
                <input type="date" id="regDate" name="regDate">
                <span class="error-message" id="regDateError"></span>
            </div>
        </fieldset>

        <!-- Submit & Reset Buttons -->
        <div class="button-group">
            <button type="reset" id="resetBtn">Reset</button>
            <button type="submit" id="submitBtn">Register Patient</button>
        </div>
    </form>

    <!-- Link to external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
