<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration</title>
   
    <!-- Beginner-friendly CSS starts here -->
    <style>
        /* 1. Style the whole page background and text font */
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5; /* Light grey-blue background */
            color: #333; /* Dark grey text for readability */
            margin: 0;
            padding: 20px;
        }

        /* 2. Center the headings */
        header, footer {
            text-align: center;
        }

        /* 3. Create a white "card" for the form to live inside */
        main {
            background-color: white;
            max-width: 600px; /* Prevents the form from stretching too wide */
            margin: 0 auto; /* Magically centers the box on the screen */
            padding: 30px;
            border-radius: 10px; /* Rounds the corners of the box */
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); /* Adds a soft shadow */
        }

        /* 4. Make labels bold and block-level so they sit on their own line */
        label {
            font-weight: bold;
            display: inline-block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        /* 5. Style the text input boxes and dropdowns */
        input[type="text"],
        input[type="number"],
        input[type="tel"],
        input[type="email"],
        input[type="date"],
        select {
            width: 100%; /* Makes inputs fill the container */
            padding: 10px; /* Adds space inside the text box */
            border: 1px solid #ccc; /* Light grey border */
            border-radius: 5px; /* Rounded corners for inputs */
            box-sizing: border-box; /* Ensures padding doesn't stretch the width */
        }

        /* 6. Style the fieldsets (Symptoms and Report Format) */
        fieldset {
            border: 1px solid #ccc;
            border-radius: 5px;
            margin-top: 20px;
            padding: 15px;
            background-color: #fcfcfc;
        }

        legend {
            font-weight: bold;
            color: #0056b3; /* Blue text for the legend */
        }

        /* 7. Fix spacing for checkboxes and radio buttons inside fieldsets */
        fieldset label {
            font-weight: normal; /* Removes bolding from checkbox text */
            margin-top: 0; /* Resets the margin we added to standard labels */
        }

        fieldset input {
            margin-bottom: 10px;
        }

        /* 8. Style the Submit and Reset buttons */
        input[type="submit"],
        input[type="reset"] {
            background-color: #0056b3; /* Medical blue */
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer; /* Changes mouse to a hand when hovering */
            font-size: 16px;
            margin-top: 20px;
            margin-right: 10px;
        }

        /* Make buttons change color slightly when you hover over them */
        input[type="submit"]:hover,
        input[type="reset"]:hover {
            background-color: #003d82;
        }
    </style>
</head>

<body>

    <header>
        <h1>AI-enabled Urine Test Strip Reader</h1>
        <h2>Patient Registration Form</h2>
    </header>

    <main>
        <form action="#" method="post">

            <!-- Patient Name -->
            <label for="patientName">Patient Name:</label>
            <input type="text" id="patientName" name="patientName" placeholder="Enter patient name" required>

            <!-- Age -->
            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="1" max="120" placeholder="Enter age" required>

            <!-- Gender -->
            <label for="gender">Gender:</label>
            <select id="gender" name="gender" required>
                <option value="">-- Select Gender --</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>

            <!-- Mobile Number -->
            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter 10-digit mobile number" pattern="[0-9]{10}" required>

            <!-- Email -->
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter email address" required>

            <!-- Patient ID -->
            <label for="patientId">Patient ID:</label>
            <input type="text" id="patientId" name="patientId" placeholder="Enter patient ID" required>

            <!-- Test Date -->
            <label for="testDate">Test Date:</label>
            <input type="date" id="testDate" name="testDate" required>

            <!-- Doctor Name -->
            <label for="doctorName">Doctor Name:</label>
            <input type="text" id="doctorName" name="doctorName" placeholder="Enter doctor's name" required>

            <!-- Symptoms -->
            <fieldset>
                <legend>Symptoms</legend>
                <input type="checkbox" id="fever" name="symptoms" value="Fever">
                <label for="fever">Fever</label><br>

                <input type="checkbox" id="painfulUrination" name="symptoms" value="Painful Urination">
                <label for="painfulUrination">Painful Urination</label><br>

                <input type="checkbox" id="frequentUrination" name="symptoms" value="Frequent Urination">
                <label for="frequentUrination">Frequent Urination</label><br>

                <input type="checkbox" id="abdominalPain" name="symptoms" value="Abdominal Pain">
                <label for="abdominalPain">Abdominal Pain</label><br>

                <input type="checkbox" id="bloodInUrine" name="symptoms" value="Blood in Urine">
                <label for="bloodInUrine">Blood in Urine</label><br>

                <input type="checkbox" id="none" name="symptoms" value="None">
                <label for="none">None</label>
            </fieldset>

            <!-- Preferred Report Format -->
            <fieldset>
                <legend>Preferred Report Format</legend>
                <input type="radio" id="pdf" name="reportFormat" value="PDF" required>
                <label for="pdf">PDF</label><br>

                <input type="radio" id="html" name="reportFormat" value="HTML">
                <label for="html">HTML</label><br>

                <input type="radio" id="printed" name="reportFormat" value="Printed">
                <label for="printed">Printed Copy</label>
            </fieldset>

            <!-- Buttons -->
            <input type="submit" value="Submit">
            <input type="reset" value="Reset">

        </form>
    </main>

    <footer>
        <p>&copy; 2026 AI-enabled Urine Test Strip Reader Web Portal</p>
    </footer>

</body>
</html>
