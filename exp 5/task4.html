<!DOCTYPE html>
<html>
<head>
    <title>Patient Age Analysis</title>
</head>
<body>

<h2>Patient Age Analysis</h2>

<script>

let patientAges = [22, 35, 67, 45, 29, 72, 56, 18, 64, 40];

// 1. Display all patient ages
console.log("All Patient Ages:", patientAges);

// 2. Find minimum age
let minimumAge = Math.min(...patientAges);

// 3. Find maximum age
let maximumAge = Math.max(...patientAges);

// 4. Calculate average age
let totalAge = 0;

for (let i = 0; i < patientAges.length; i++) {
    totalAge = totalAge + patientAges[i];
}

let averageAge = totalAge / patientAges.length;

// 5. Count senior citizens
let seniorCount = 0;

for (let i = 0; i < patientAges.length; i++) {
    if (patientAges[i] >= 60) {
        seniorCount++;
    }
}

// 6. Count patients below 18
let below18Count = 0;

for (let i = 0; i < patientAges.length; i++) {
    if (patientAges[i] < 18) {
        below18Count++;
    }
}

// 7. Display patients whose age is greater than 60
let above60 = [];

for (let i = 0; i < patientAges.length; i++) {
    if (patientAges[i] > 60) {
        above60.push(patientAges[i]);
    }
}


// Display results in console
console.log("Minimum Age:", minimumAge);
console.log("Maximum Age:", maximumAge);
console.log("Average Age:", averageAge);
console.log("Senior Citizens:", seniorCount);
console.log("Patients Below 18:", below18Count);
console.log("Patients Above 60:", above60);


// Display results on webpage
document.write("All Patient Ages: " + patientAges + "<br>");
document.write("Minimum Age: " + minimumAge + "<br>");
document.write("Maximum Age: " + maximumAge + "<br>");
document.write("Average Age: " + averageAge.toFixed(2) + "<br>");
document.write("Senior Citizens: " + seniorCount + "<br>");
document.write("Patients Below 18: " + below18Count + "<br>");
document.write("Patients Above 60: " + above60);

</script>

</body>
</html>
